<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8" />
  <style>
    :root {
      --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
      --text-main: #f8fafc;
      --text-sub: #94a3b8;
      --primary: #6366f1;
      --primary-hover: #4f46e5;
      --border-color: #334155;
      --input-bg: #0f172a;
    }

    body {
      width: 250px;
      margin: 0;
      padding: 16px;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
      background: var(--bg-gradient);
      color: var(--text-main);
      border-radius: 8px;
    }

    .header {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 16px;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 10px;
    }

    .logo-icon {
      font-size: 18px;
    }

    .title {
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 0.5px;
      background: linear-gradient(to right, #818cf8, #c084fc);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .field-group {
      margin-bottom: 12px;
    }

    label {
      display: block;
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--text-sub);
      margin-bottom: 6px;
    }

    input[type="text"],
    select {
      width: 100%;
      box-sizing: border-box;
      padding: 8px 10px;
      background: var(--input-bg);
      border: 1px solid var(--border-color);
      border-radius: 6px;
      color: var(--text-main);
      font-size: 13px;
      outline: none;
      transition: all 0.2s ease;
    }

    input[type="text"]:focus,
    select:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 2px rgba(99, 102, 241, 0.2);
    }

    .status-container {
      height: 16px;
      margin-top: 8px;
      display: flex;
      align-items: center;
      justify-content: flex-end;
    }

    #status {
      font-size: 11px;
      color: #34d399;
      font-weight: 500;
      opacity: 0;
      transition: opacity 0.2s ease;
    }

    #status.show {
      opacity: 1;
    }
  </style>
</head>

<body>
  <div class="header">
    <span class="logo-icon">🌐</span>
    <span class="title">Gemini Translate</span>
  </div>

  <div class="field-group">
    <label for="targetLang">Ngôn ngữ đích</label>
    <input id="targetLang" type="text" placeholder="vd: vi, english, japanese..." />
  </div>

  <div class="field-group">
    <label for="selectedModel">Dịch bằng Model</label>
    <select id="selectedModel">
      <option value="gemini-3.5-flash-lite">Gemini 3.5 Flash Lite</option>
      <option value="gemini-3.1-flash-lite">Gemini 3.1 Flash Lite</option>
      <option value="gemini-2.5-flash-lite">Gemini 2.5 Flash Lite</option>
      <option value="gemini-2.5-flash">Gemini 2.5 Flash</option>
      <option value="gemini-2.5-pro">Gemini 2.5 Pro</option>
      <option value="gemini-1.5-flash">Gemini 1.5 Flash</option>
      <option value="gemini-1.5-pro">Gemini 1.5 Pro</option>
    </select>
  </div>

  <div class="status-container">
    <div id="status">Đã lưu tự động ✓</div>
  </div>

  <script src="popup.js"></script>
</body>

</html>
